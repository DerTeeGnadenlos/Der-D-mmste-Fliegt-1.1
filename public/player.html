<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Der Dümmste fliegt – Spieler</title>
<style>
:root{--bg:#070910;--panel:#111624;--line:#2c3447;--text:#f7f8fc;--muted:#9ba5b9;--gold:#ffb000;--green:#2bdc8a;--red:#ff456a;--purple:#8c2de2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#28113c,#070910 55%);font-family:Segoe UI,Arial,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}.card{width:min(94vw,560px);background:#0d121ee8;border:1px solid var(--line);border-radius:18px;padding:24px}h1{margin:0;font-size:29px;letter-spacing:.06em}h1 i{color:var(--gold)}p{color:var(--muted)}input,select,button{font:inherit;border-radius:9px}input,select{width:100%;background:#090d16;border:1px solid var(--line);color:white;padding:11px;margin:6px 0}button{border:0;background:#6320aa;color:white;padding:11px 13px;font-weight:900;cursor:pointer}.full{width:100%}video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#030408;border-radius:12px;margin:12px 0}.stats{display:flex;justify-content:space-between;gap:10px;background:#0a0e18;border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:900}.safe{color:var(--green)}.panel{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0a0f19}.panel h3{margin:0 0 8px;color:var(--gold);font-size:13px}.choices{display:grid;gap:6px}.choice{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:8px}.choice input{width:auto;margin:0}.hidden{display:none!important}.status{font-size:13px;color:var(--muted)}.ok{color:var(--green)}.volume{display:grid;grid-template-columns:auto 1fr 42px;gap:8px;align-items:center;margin-top:10px}.volume input{margin:0}.vote-result{font-weight:900;color:var(--gold);margin-top:8px}
</style></head><body><div class="card">
<h1>DER DÜMMSTE <i>FLIEGT</i></h1><p>Kamera verbinden und an Abstimmungen teilnehmen.</p>
<div id="joinBox"><input id="room" placeholder="Raumcode"><input id="name" maxlength="30" placeholder="Dein Name"><button id="join" class="full">BEITRETEN</button></div>
<div id="game" class="hidden"><div id="status" class="status">Verbunden…</div><video id="preview" autoplay muted playsinline></video><div class="stats"><span id="myName"></span><span>❤️ <b id="lives">3</b></span><span id="safe" class="safe"></span></div>
<div class="volume"><label for="volume">🔊</label><input id="volume" type="range" min="0" max="100" value="65"><span id="volumeText">65%</span></div>
<div id="votePanel" class="panel hidden"><h3>🗳️ VOTING</h3><div id="voteChoices" class="choices"></div><button id="submitVote" class="full">STIMME ABGEBEN</button><div id="voteStatus" class="status"></div></div>
<div id="tiebreakPanel" class="panel hidden"><h3>⚡ STECHEN</h3><p>Gib deine Zahl ein. Die Zahlen werden erst vom Host aufgedeckt.</p><input id="tiebreakValue" inputmode="decimal" placeholder="Deine Zahl"><button id="submitTiebreak" class="full">ZAHL ABGEBEN</button><div id="tiebreakStatus" class="status"></div></div>
</div>
<audio id="sndCorrect"></audio><audio id="sndWrong"></audio><audio id="sndSafe"></audio><audio id="sndEliminate"></audio>
<script>
let ws,room,pc,stream,playerId,currentVoteId,currentTiebreakId,iceServers=[{urls:'stun:stun.l.google.com:19302'}];
const $=id=>document.getElementById(id);const parts=location.pathname.split('/').filter(Boolean);if(parts[0]==='join'&&parts[1])$('room').value=parts[1].toUpperCase();
let volume=Number(localStorage.getItem('ddf_volume')||65)/100;$('volume').value=Math.round(volume*100);$('volumeText').textContent=Math.round(volume*100)+'%';
$('volume').addEventListener('input',e=>{volume=Number(e.target.value)/100;localStorage.setItem('ddf_volume',e.target.value);$('volumeText').textContent=e.target.value+'%';});
function beep(kind){const ctx=new (window.AudioContext||window.webkitAudioContext)(),g=ctx.createGain(),o=ctx.createOscillator();o.connect(g);g.connect(ctx.destination);const f={correct:330,wrong:116,safe:262,eliminate:82,final:220,winner:262}[kind]||220;o.frequency.value=f;g.gain.value=.12*volume;o.start();o.stop(ctx.currentTime+(kind==='safe'?.35:.22));}
async function ice(){try{const r=await fetch('/api/ice'),j=await r.json();if(j.iceServers)iceServers=j.iceServers}catch{}}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify({...o,room}))}
async function peer(init){if(pc)return;pc=new RTCPeerConnection({iceServers});pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',candidate:e.candidate})};if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));if(init){const o=await pc.createOffer();await pc.setLocalDescription(o);send({type:'offer',sdp:pc.localDescription})}}
async function media(){try{stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});$('preview').srcObject=stream;$('status').textContent='Kamera verbunden.'}catch{$('status').textContent='Kamera nicht freigegeben. Du kannst trotzdem voten.'}}
async function join(){room=$('room').value.trim().toUpperCase();const name=$('name').value.trim()||'Spieler';if(!room)return alert('Raumcode eingeben.');await ice();const token=localStorage.getItem('ddf_token_'+room);ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send({type:'join-room',name,sessionToken:token});ws.onmessage=async e=>handle(JSON.parse(e.data));ws.onclose=()=>{$('status').textContent='Verbindung verloren – erneuter Verbindungsversuch…';setTimeout(join,2500)}}
async function handle(m){
 if(m.type==='error'){alert(m.message);return}
 if(m.type==='joined'){playerId=m.player.id;localStorage.setItem('ddf_token_'+room,m.player.sessionToken);$('joinBox').classList.add('hidden');$('game').classList.remove('hidden');$('myName').textContent=m.player.name;$('lives').textContent=m.player.lives;$('safe').textContent=m.player.safe?'SAFE':'';if(!stream)await media();pc?.close();pc=null}
 if(m.type==='offer'){pc?.close();pc=null;await peer(false);await pc.setRemoteDescription(m.sdp);const a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'answer',sdp:pc.localDescription})}
 if(m.type==='answer'&&pc)await pc.setRemoteDescription(m.sdp);if(m.type==='ice'&&pc&&m.candidate)try{await pc.addIceCandidate(m.candidate)}catch{}
 if(m.type==='state'){$('myName').textContent=m.name;$('lives').textContent=m.lives;$('safe').textContent=m.safe?'SAFE':''}
 if(m.type==='effect')beep(m.effect);
 if(m.type==='vote-start'){currentVoteId=m.voteId;$('votePanel').classList.remove('hidden');$('voteStatus').textContent='';$('submitVote').disabled=false;const box=$('voteChoices');box.innerHTML='';m.candidates.forEach(c=>{const l=document.createElement('label');l.className='choice';l.innerHTML=`<input type="radio" name="vote" value="${c.id}"><span>${c.name}${c.id===playerId?' (DU)':''}</span>`;box.appendChild(l)})}
 if(m.type==='vote-accepted'){$('voteStatus').textContent='Stimme gespeichert. Jetzt heißt es warten…';$('voteStatus').className='status ok';$('submitVote').disabled=true}
 if(m.type==='vote-ended'){$('votePanel').classList.add('hidden')}
 if(m.type==='tiebreak-start'){currentTiebreakId=m.tiebreakId;$('tiebreakPanel').classList.remove('hidden');$('tiebreakValue').value='';$('submitTiebreak').disabled=false;$('tiebreakStatus').textContent=''}
 if(m.type==='tiebreak-accepted'){$('submitTiebreak').disabled=true;$('tiebreakStatus').textContent='Zahl gespeichert.';$('tiebreakStatus').className='status ok'}
 if(m.type==='tiebreak-ended')$('tiebreakPanel').classList.add('hidden');
 if(m.type==='kicked'){alert('Du wurdest aus der Session entfernt.');location.reload()}if(m.type==='host-left')$('status').textContent='Host hat die Session beendet.';
}
$('join').addEventListener('click',join);$('submitVote').addEventListener('click',()=>{const r=document.querySelector('input[name="vote"]:checked');if(!r)return alert('Bitte einen Spieler auswählen.');send({type:'submit-vote',voteId:currentVoteId,targetId:r.value})});$('submitTiebreak').addEventListener('click',()=>{const v=$('tiebreakValue').value.trim();if(!v)return alert('Bitte eine Zahl eingeben.');send({type:'submit-tiebreak',tiebreakId:currentTiebreakId,value:v})});
</script></div></body></html>
